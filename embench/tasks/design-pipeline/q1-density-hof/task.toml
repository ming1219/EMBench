schema_version = "1.0"

[task]
id = "design-pipeline/q1-density-hof"
family = "design-pipeline"
description = "含能分子设计流水线：3 候选 × (KJ + 逆合成) + 推荐"
difficulty = "hard"
tags = ["chemprop", "aizynthfinder", "generation", "pipeline"]
legacy = { exp = "Exp14_design_pipeline", key = "Q1_density_hof" }

[agent]
timeout_sec = 1800

[[verifier.checks]]
id = "tools"
type = "tools_used"
all_of = ["generateAndPredict", "calculateKJ", "predictRetrosynthesis"]

[[verifier.checks]]
id = "gen_args"
type = "arg_constraints"
tool = "generateAndPredict"
which = "sum"
constraints = { num = { eq = 3 } }
description = "候选总数 = N（允许分多次生成，如按类别各生成一批）"

[[verifier.checks]]
id = "gen_em"
type = "arg_constraints"
tool = "generateAndPredict"
which = "all"
constraints = { use_em = { eq = true, default = true } }

[[verifier.checks]]
id = "retro_args"
type = "arg_constraints"
tool = "predictRetrosynthesis"
which = "all"
constraints = { max_routes = { le = 3 }, time_limit = { le = 30 } }
description = "逆合成按指令的小参数搜索（避免 120s 慢搜）"

[[verifier.checks]]
id = "coverage"
type = "candidate_coverage"
gate = ["coverage"]
downstream = { calculateKJ = "smiles", predictRetrosynthesis = "smiles" }
description = "每个生成候选都走完 KJ + 逆合成；consistency（下游输入来自生成结果）只报告不卡 pass"

[[verifier.checks]]
id = "recommend_candidate"
type = "answer_recommends_candidate"
description = "最终回答必须明确推荐至少一个分子（给出 SMILES），且被推荐的分子全部来自本次生成结果；暂缓/拒答、推荐生成集外的分子都判错"

[[verifier.checks]]
id = "budget"
type = "call_budget"
max_calls = 8
description = "调用数不超过参考轨迹（软指标，不影响 pass）"
