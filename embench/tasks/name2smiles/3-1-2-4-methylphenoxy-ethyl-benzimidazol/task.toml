schema_version = "1.0"

[task]
id = "name2smiles/3-1-2-4-methylphenoxy-ethyl-benzimidazol"
family = "name2smiles"
description = "名称→SMILES：3-[1-[2-(4-methylphenoxy)ethyl]benzimidazol-2-yl]propan-1-ol"
difficulty = "easy"
tags = ["pubchem"]
legacy = { exp = "Exp1_name_to_smiles", key = "3-[1-[2-(4-methylphenoxy)ethyl]benzimidazol-2-yl]propan-1-ol" }

[agent]
timeout_sec = 180

[[verifier.checks]]
id = "trajectory"
type = "tool_calls_match"
ordered = true
calls = [{ tool = "nameToSmiles", args = { name = "3-[1-[2-(4-methylphenoxy)ethyl]benzimidazol-2-yl]propan-1-ol" } }]
description = "调用 nameToSmiles 且 name 正确（别名 CL20/CL-20 视为相同）"

[[verifier.checks]]
id = "answer"
type = "answer_smiles"
expected = ["CC1=CC=C(C=C1)OCCN2C3=CC=CC=C3N=C2CCCO"]
description = "最终回答给出正确 SMILES（canonical 比较，写法不同不扣分）"

[[verifier.checks]]
id = "budget"
type = "call_budget"
max_calls = 1
description = "调用数不超过参考轨迹（软指标，不影响 pass）"
