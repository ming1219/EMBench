schema_version = "1.0"

[task]
id = "name2smiles/1-2-methylphenyl-3-3-methylpyridin-2-yl"
family = "name2smiles"
description = "名称→SMILES：1-(2-methylphenyl)-3-(3-methylpyridin-2-yl)urea"
difficulty = "easy"
tags = ["pubchem"]
legacy = { exp = "Exp1_name_to_smiles", key = "1-(2-methylphenyl)-3-(3-methylpyridin-2-yl)urea" }

[agent]
timeout_sec = 180

[[verifier.checks]]
id = "trajectory"
type = "tool_calls_match"
ordered = true
calls = [{ tool = "nameToSmiles", args = { name = "1-(2-methylphenyl)-3-(3-methylpyridin-2-yl)urea" } }]
description = "调用 nameToSmiles 且 name 正确（别名 CL20/CL-20 视为相同）"

[[verifier.checks]]
id = "answer"
type = "answer_smiles"
expected = ["CC1=C(N=CC=C1)NC(=O)NC2=CC=CC=C2C"]
description = "最终回答给出正确 SMILES（canonical 比较，写法不同不扣分）"

[[verifier.checks]]
id = "budget"
type = "call_budget"
max_calls = 1
description = "调用数不超过参考轨迹（软指标，不影响 pass）"
