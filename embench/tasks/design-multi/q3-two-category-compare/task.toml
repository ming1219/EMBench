schema_version = "1.0"

[task]
id = "design-multi/q3-two-category-compare"
family = "design-multi"
description = "分类fan-out+跨类聚合:硝胺/硝基芳烃各2候选,预测Density/DetoD/Td+KJ+retro,每类推荐1个最优(点名代号,分类)"
difficulty = "hard"
tags = ["chemprop", "aizynthfinder", "generation", "pipeline"]
legacy = { exp = "Exp15_design_multi", key = "Q3_two_category_compare" }

[agent]
timeout_sec = 1800

[[verifier.checks]]
id = "tools"
type = "tools_used"
all_of = ["generateAndPredict", "calculateKJ", "predictRetrosynthesis"]

[[verifier.checks]]
id = "gen_args"
type = "arg_constraints"
tool = "generateAndPredict"
which = "sum"
constraints = { num = { eq = 4 } }
description = "候选总数 = N（允许分多次生成，如按类别各生成一批）"

[[verifier.checks]]
id = "gen_em"
type = "arg_constraints"
tool = "generateAndPredict"
which = "all"
constraints = { use_em = { eq = true, default = true } }

[[verifier.checks]]
id = "retro_args"
type = "arg_constraints"
tool = "predictRetrosynthesis"
which = "all"
constraints = { max_routes = { le = 3 }, time_limit = { le = 30 } }
description = "逆合成按指令的小参数搜索（避免 120s 慢搜）"

[[verifier.checks]]
id = "coverage"
type = "candidate_coverage"
gate = ["coverage"]
downstream = { calculateKJ = "smiles", predictRetrosynthesis = "smiles" }
description = "每个生成候选都走完 KJ + 逆合成；consistency（下游输入来自生成结果）只报告不卡 pass"

[[verifier.checks]]
id = "recommend"
type = "answer_contains"
any_of = ["推荐", "建议", "最优", "最佳", "首选"]
none_of = ["无法回答", "无法推荐", "不推荐任何", "没有完成", "未完成", "无法完成", "不能推荐"]
min_length = 15
description = "最终回答给出推荐结论，且不是拒答/未完成的说法"

[[verifier.checks]]
id = "recommend_candidate"
type = "answer_mentions_candidate"
description = "最终回答必须点名（给出 SMILES）至少一个本次真实生成过的候选"

[[verifier.checks]]
id = "budget"
type = "call_budget"
max_calls = 10
description = "调用数不超过参考轨迹（软指标，不影响 pass）"
