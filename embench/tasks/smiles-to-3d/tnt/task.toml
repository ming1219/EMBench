schema_version = "1.0"

[task]
id = "smiles-to-3d/tnt"
family = "smiles-to-3d"
description = "SMILES→3D 结构：TNT"
difficulty = "easy"
tags = ["builtin"]
legacy = { exp = "Exp3_smiles_to_3d", key = "TNT" }

[agent]
timeout_sec = 180

[[verifier.checks]]
id = "trajectory"
type = "tool_calls_match"
ordered = true
calls = [{ tool = "smilesTo3D", args = { smiles = "Cc1c(cc(cc1[N+](=O)[O-])[N+](=O)[O-])[N+](=O)[O-]" } }]

[[verifier.checks]]
id = "structure_output"
type = "tool_result_values"
tool = "smilesTo3D"
expected = { formula = "C7H5N3O6", num_atoms = 21 }
description = "3D 结构的分子式与原子数（含 H）正确"

[[verifier.checks]]
id = "budget"
type = "call_budget"
max_calls = 1
description = "调用数不超过参考轨迹（软指标，不影响 pass）"
