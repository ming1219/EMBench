schema_version = "1.0"

[task]
id = "smiles-to-3d/pubchem-3"
family = "smiles-to-3d"
description = "SMILES→3D 结构：PubChem_3"
difficulty = "easy"
tags = ["pubchem"]
legacy = { exp = "Exp3_smiles_to_3d", key = "PubChem_3" }

[agent]
timeout_sec = 180

[[verifier.checks]]
id = "trajectory"
type = "tool_calls_match"
ordered = true
calls = [{ tool = "smilesTo3D", args = { smiles = "CCS(=O)(=O)N1C(CC(=N1)C2=CC(=CC=C2)NS(=O)(=O)C)C3=CC=CC=C3" } }]

[[verifier.checks]]
id = "structure_output"
type = "tool_result_values"
tool = "smilesTo3D"
expected = { formula = "C18H21N3O4S2", num_atoms = 48 }
description = "3D 结构的分子式与原子数（含 H）正确"

[[verifier.checks]]
id = "budget"
type = "call_budget"
max_calls = 1
description = "调用数不超过参考轨迹（软指标，不影响 pass）"
