schema_version = "1.0"

[task]
id = "smiles-to-3d/pubchem-5"
family = "smiles-to-3d"
description = "SMILES→3D 结构：PubChem_5"
difficulty = "easy"
tags = ["pubchem"]
legacy = { exp = "Exp3_smiles_to_3d", key = "PubChem_5" }

[agent]
timeout_sec = 180

[[verifier.checks]]
id = "trajectory"
type = "tool_calls_match"
ordered = true
calls = [{ tool = "smilesTo3D", args = { smiles = "COC(=O)CCCNC1=C(C=C(C=C1)C(=O)C2=CC=CC=C2)[N+](=O)[O-]" } }]

[[verifier.checks]]
id = "structure_output"
type = "tool_result_values"
tool = "smilesTo3D"
expected = { formula = "C18H18N2O5", num_atoms = 43 }
description = "3D 结构的分子式与原子数（含 H）正确"

[[verifier.checks]]
id = "budget"
type = "call_budget"
max_calls = 1
description = "调用数不超过参考轨迹（软指标，不影响 pass）"
