schema_version = "1.0"

[task]
id = "smiles-to-3d/pubchem-1"
family = "smiles-to-3d"
description = "SMILES→3D 结构：PubChem_1"
difficulty = "easy"
tags = ["pubchem"]
legacy = { exp = "Exp3_smiles_to_3d", key = "PubChem_1" }

[agent]
timeout_sec = 180

[[verifier.checks]]
id = "trajectory"
type = "tool_calls_match"
ordered = true
calls = [{ tool = "smilesTo3D", args = { smiles = "C1=CC(=C(C(=C1)Cl)CN2C=NC3=C(N=CN=C32)NCC4=CC=CO4)Cl" } }]

[[verifier.checks]]
id = "structure_output"
type = "tool_result_values"
tool = "smilesTo3D"
expected = { formula = "C17H13Cl2N5O", num_atoms = 38 }
description = "3D 结构的分子式与原子数（含 H）正确"

[[verifier.checks]]
id = "budget"
type = "call_budget"
max_calls = 1
description = "调用数不超过参考轨迹（软指标，不影响 pass）"
