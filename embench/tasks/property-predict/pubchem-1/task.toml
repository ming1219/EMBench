schema_version = "1.0"

[task]
id = "property-predict/pubchem-1"
family = "property-predict"
description = "校验+性质预测（Density,Td）：PubChem_1"
difficulty = "medium"
tags = ["chemprop", "pubchem"]
legacy = { exp = "Exp4_property_predict", key = "PubChem_1" }

[agent]
timeout_sec = 300

[[verifier.checks]]
id = "trajectory"
type = "tool_calls_match"
ordered = true
calls = [{ tool = "validateSmiles", args = { smiles = "C1=CC(=C(C(=C1)Cl)CN2C=NC3=C(N=CN=C32)NCC4=CC=CO4)Cl" } }, { tool = "batchPredictProperties", args = { smiles_list = ["C1=CC(=C(C(=C1)Cl)CN2C=NC3=C(N=CN=C32)NCC4=CC=CO4)Cl"], properties = ["Density", "Td"] } }]
description = "先校验再预测；properties 集合比较，兼容 JSON 字符串形式"

[[verifier.checks]]
id = "predict_values"
type = "tool_result_values"
tool = "batchPredictProperties"
expected = { Density = 1.377239585778128, Td = 314.2287553944451 }
match_smiles = "C1=CC(=C(C(=C1)Cl)CN2C=NC3=C(N=CN=C32)NCC4=CC=CO4)Cl"
rel_tol = 0.01
description = "chemprop 同机确定性预测，相对误差 < 1%"

[[verifier.checks]]
id = "budget"
type = "call_budget"
max_calls = 2
description = "调用数不超过参考轨迹（软指标，不影响 pass）"
