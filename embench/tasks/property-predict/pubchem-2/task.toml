schema_version = "1.0"

[task]
id = "property-predict/pubchem-2"
family = "property-predict"
description = "校验+性质预测（Density）：PubChem_2"
difficulty = "medium"
tags = ["chemprop", "pubchem"]
legacy = { exp = "Exp4_property_predict", key = "PubChem_2" }

[agent]
timeout_sec = 300

[[verifier.checks]]
id = "trajectory"
type = "tool_calls_match"
ordered = true
calls = [{ tool = "validateSmiles", args = { smiles = "C1=CC=C(C(=C1)O)P(=O)(C2=CC=CC=C2O)O" } }, { tool = "batchPredictProperties", args = { smiles_list = ["C1=CC=C(C(=C1)O)P(=O)(C2=CC=CC=C2O)O"], properties = ["Density"] } }]
description = "先校验再预测；properties 集合比较，兼容 JSON 字符串形式"

[[verifier.checks]]
id = "predict_values"
type = "tool_result_values"
tool = "batchPredictProperties"
expected = { Density = 1.4502749667694863 }
match_smiles = "C1=CC=C(C(=C1)O)P(=O)(C2=CC=CC=C2O)O"
rel_tol = 0.01
description = "chemprop 同机确定性预测，相对误差 < 1%"

[[verifier.checks]]
id = "budget"
type = "call_budget"
max_calls = 2
description = "调用数不超过参考轨迹（软指标，不影响 pass）"
