schema_version = "1.0"

[task]
id = "property-predict/tnt"
family = "property-predict"
description = "校验+性质预测（Density,DetoD）：TNT"
difficulty = "medium"
tags = ["chemprop", "builtin"]
legacy = { exp = "Exp4_property_predict", key = "TNT" }

[agent]
timeout_sec = 300

[[verifier.checks]]
id = "trajectory"
type = "tool_calls_match"
ordered = true
calls = [{ tool = "validateSmiles", args = { smiles = "Cc1c(cc(cc1[N+](=O)[O-])[N+](=O)[O-])[N+](=O)[O-]" } }, { tool = "batchPredictProperties", args = { smiles_list = ["Cc1c(cc(cc1[N+](=O)[O-])[N+](=O)[O-])[N+](=O)[O-]"], properties = ["Density", "DetoD"] } }]
description = "先校验再预测；properties 集合比较，兼容 JSON 字符串形式"

[[verifier.checks]]
id = "predict_values"
type = "tool_result_values"
tool = "batchPredictProperties"
expected = { Density = 1.6552738773541829, DetoD = 6983.439381491358 }
match_smiles = "Cc1c(cc(cc1[N+](=O)[O-])[N+](=O)[O-])[N+](=O)[O-]"
rel_tol = 0.01
description = "chemprop 同机确定性预测，相对误差 < 1%"

[[verifier.checks]]
id = "budget"
type = "call_budget"
max_calls = 2
description = "调用数不超过参考轨迹（软指标，不影响 pass）"
