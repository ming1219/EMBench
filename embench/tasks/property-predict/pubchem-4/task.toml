schema_version = "1.0"

[task]
id = "property-predict/pubchem-4"
family = "property-predict"
description = "校验+性质预测（Density,DetoD）：PubChem_4"
difficulty = "medium"
tags = ["chemprop", "pubchem"]
legacy = { exp = "Exp4_property_predict", key = "PubChem_4" }

[agent]
timeout_sec = 300

[[verifier.checks]]
id = "trajectory"
type = "tool_calls_match"
ordered = true
calls = [{ tool = "validateSmiles", args = { smiles = "CC1=CC2=C(C=C1)N=C(C=C2C(=O)O)C3=CC(=C(C(=C3)OC)OC)OC" } }, { tool = "batchPredictProperties", args = { smiles_list = ["CC1=CC2=C(C=C1)N=C(C=C2C(=O)O)C3=CC(=C(C(=C3)OC)OC)OC"], properties = ["Density", "DetoD"] } }]
description = "先校验再预测；properties 集合比较，兼容 JSON 字符串形式"

[[verifier.checks]]
id = "predict_values"
type = "tool_result_values"
tool = "batchPredictProperties"
expected = { Density = 1.3756241486782275, DetoD = 3751.8982215316464 }
match_smiles = "CC1=CC2=C(C=C1)N=C(C=C2C(=O)O)C3=CC(=C(C(=C3)OC)OC)OC"
rel_tol = 0.01
description = "chemprop 同机确定性预测，相对误差 < 1%"

[[verifier.checks]]
id = "budget"
type = "call_budget"
max_calls = 2
description = "调用数不超过参考轨迹（软指标，不影响 pass）"
