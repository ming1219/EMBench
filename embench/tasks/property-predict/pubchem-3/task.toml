schema_version = "1.0"

[task]
id = "property-predict/pubchem-3"
family = "property-predict"
description = "校验+性质预测（HOF_S）：PubChem_3"
difficulty = "medium"
tags = ["chemprop", "pubchem"]
legacy = { exp = "Exp4_property_predict", key = "PubChem_3" }

[agent]
timeout_sec = 300

[[verifier.checks]]
id = "trajectory"
type = "tool_calls_match"
ordered = true
calls = [{ tool = "validateSmiles", args = { smiles = "CCS(=O)(=O)N1C(CC(=N1)C2=CC(=CC=C2)NS(=O)(=O)C)C3=CC=CC=C3" } }, { tool = "batchPredictProperties", args = { smiles_list = ["CCS(=O)(=O)N1C(CC(=N1)C2=CC(=CC=C2)NS(=O)(=O)C)C3=CC=CC=C3"], properties = ["HOF_S"] } }]
description = "先校验再预测；properties 集合比较，兼容 JSON 字符串形式"

[[verifier.checks]]
id = "predict_values"
type = "tool_result_values"
tool = "batchPredictProperties"
expected = { HOF_S = -523.6127604647908 }
match_smiles = "CCS(=O)(=O)N1C(CC(=N1)C2=CC(=CC=C2)NS(=O)(=O)C)C3=CC=CC=C3"
rel_tol = 0.01
description = "chemprop 同机确定性预测，相对误差 < 1%"

[[verifier.checks]]
id = "budget"
type = "call_budget"
max_calls = 2
description = "调用数不超过参考轨迹（软指标，不影响 pass）"
