schema_version = "1.0"

[task]
id = "property-predict/tatb"
family = "property-predict"
description = "校验+性质预测（DetoD,Td）：TATB"
difficulty = "medium"
tags = ["chemprop", "builtin"]
legacy = { exp = "Exp4_property_predict", key = "TATB" }

[agent]
timeout_sec = 300

[[verifier.checks]]
id = "trajectory"
type = "tool_calls_match"
ordered = true
calls = [{ tool = "validateSmiles", args = { smiles = "Nc1c([N+](=O)[O-])c(N)c([N+](=O)[O-])c(N)c1[N+](=O)[O-]" } }, { tool = "batchPredictProperties", args = { smiles_list = ["Nc1c([N+](=O)[O-])c(N)c([N+](=O)[O-])c(N)c1[N+](=O)[O-]"], properties = ["DetoD", "Td"] } }]
description = "先校验再预测；properties 集合比较，兼容 JSON 字符串形式"

[[verifier.checks]]
id = "predict_values"
type = "tool_result_values"
tool = "batchPredictProperties"
expected = { DetoD = 7885.193064730219, Td = 341.7277691003734 }
match_smiles = "Nc1c([N+](=O)[O-])c(N)c([N+](=O)[O-])c(N)c1[N+](=O)[O-]"
rel_tol = 0.01
description = "chemprop 同机确定性预测，相对误差 < 1%"

[[verifier.checks]]
id = "budget"
type = "call_budget"
max_calls = 2
description = "调用数不超过参考轨迹（软指标，不影响 pass）"
