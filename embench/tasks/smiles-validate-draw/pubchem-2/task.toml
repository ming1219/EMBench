schema_version = "1.0"

[task]
id = "smiles-validate-draw/pubchem-2"
family = "smiles-validate-draw"
description = "SMILES 校验后绘图：PubChem_2"
difficulty = "easy"
tags = ["pubchem"]
legacy = { exp = "Exp2_smiles_validate", key = "PubChem_2" }

[agent]
timeout_sec = 180

[[verifier.checks]]
id = "trajectory"
type = "tool_calls_match"
ordered = true
calls = [{ tool = "validateSmiles", args = { smiles = "C1=CC=C(C(=C1)O)P(=O)(C2=CC=CC=C2O)O" } }, { tool = "drawMolecule", args = { smiles = "C1=CC=C(C(=C1)O)P(=O)(C2=CC=CC=C2O)O" } }]
description = "先 validateSmiles 再 drawMolecule，SMILES canonical 一致；width/height 不比"

[[verifier.checks]]
id = "validate_output"
type = "tool_result_values"
tool = "validateSmiles"
expected = { valid = true, formula = "C12H11O4P" }

[[verifier.checks]]
id = "budget"
type = "call_budget"
max_calls = 2
description = "调用数不超过参考轨迹（软指标，不影响 pass）"
