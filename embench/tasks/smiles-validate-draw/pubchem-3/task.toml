schema_version = "1.0"

[task]
id = "smiles-validate-draw/pubchem-3"
family = "smiles-validate-draw"
description = "SMILES 校验后绘图：PubChem_3"
difficulty = "easy"
tags = ["pubchem"]
legacy = { exp = "Exp2_smiles_validate", key = "PubChem_3" }

[agent]
timeout_sec = 180

[[verifier.checks]]
id = "trajectory"
type = "tool_calls_match"
ordered = true
calls = [{ tool = "validateSmiles", args = { smiles = "CCS(=O)(=O)N1C(CC(=N1)C2=CC(=CC=C2)NS(=O)(=O)C)C3=CC=CC=C3" } }, { tool = "drawMolecule", args = { smiles = "CCS(=O)(=O)N1C(CC(=N1)C2=CC(=CC=C2)NS(=O)(=O)C)C3=CC=CC=C3" } }]
description = "先 validateSmiles 再 drawMolecule，SMILES canonical 一致；width/height 不比"

[[verifier.checks]]
id = "validate_output"
type = "tool_result_values"
tool = "validateSmiles"
expected = { valid = true, formula = "C18H21N3O4S2" }

[[verifier.checks]]
id = "budget"
type = "call_budget"
max_calls = 2
description = "调用数不超过参考轨迹（软指标，不影响 pass）"
