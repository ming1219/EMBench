schema_version = "1.0"

[task]
id = "smiles-validate-draw/rdx"
family = "smiles-validate-draw"
description = "SMILES 校验后绘图：RDX"
difficulty = "easy"
tags = ["builtin"]
legacy = { exp = "Exp2_smiles_validate", key = "RDX" }

[agent]
timeout_sec = 180

[[verifier.checks]]
id = "trajectory"
type = "tool_calls_match"
ordered = true
calls = [{ tool = "validateSmiles", args = { smiles = "O=[N+]([O-])N1CN([N+](=O)[O-])CN([N+](=O)[O-])C1" } }, { tool = "drawMolecule", args = { smiles = "O=[N+]([O-])N1CN([N+](=O)[O-])CN([N+](=O)[O-])C1" } }]
description = "先 validateSmiles 再 drawMolecule，SMILES canonical 一致；width/height 不比"

[[verifier.checks]]
id = "validate_output"
type = "tool_result_values"
tool = "validateSmiles"
expected = { valid = true, formula = "C3H6N6O6" }

[[verifier.checks]]
id = "budget"
type = "call_budget"
max_calls = 2
description = "调用数不超过参考轨迹（软指标，不影响 pass）"
