schema_version = "1.0"

[task]
id = "generate-predict/q3-num8-detod-detop-detoq"
family = "generate-predict"
description = "分子生成+预测：num=8 use_em=True props=['DetoD', 'DetoP', 'DetoQ']"
difficulty = "medium"
tags = ["chemprop", "generation"]
legacy = { exp = "Exp8_generate_predict", key = "Q3_num8_detod_detop_detoq" }

[agent]
timeout_sec = 600

[[verifier.checks]]
id = "gen_args"
type = "arg_constraints"
tool = "generateAndPredict"
constraints = { num = { eq = 8 }, use_em = { eq = true, default = true }, skip_prediction = { eq = false, default = false }, properties = { set_eq = ["DetoD", "DetoP", "DetoQ"] } }
description = "num/use_em/skip_prediction/properties 与指令一致（生成输出随机，只判参数合规）"

[[verifier.checks]]
id = "gen_output"
type = "generation_output"
min_count = 4
required_properties = ["DetoD", "DetoP", "DetoQ"]
description = "生成数 ≥ num/2（use_em 时 OB 过滤可能减少），且结果含全部所需性质"

[[verifier.checks]]
id = "budget"
type = "call_budget"
max_calls = 1
description = "调用数不超过参考轨迹（软指标，不影响 pass）"
